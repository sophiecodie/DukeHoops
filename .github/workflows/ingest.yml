name: Ingest Duke data

on:
  schedule:
    # Daily at 09:00 UTC (≈4-5am ET), after overnight games are final
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-ingest all seasons (otherwise current season only is refreshed)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt

      - name: Restore HTTP cache
        uses: actions/cache@v4
        with:
          path: ingestion/.cache
          key: espn-cache-${{ github.run_id }}
          restore-keys: espn-cache-

      - run: pip install -r ingestion/requirements.txt

      - name: Ingest from ESPN
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python ingestion/espn_ingest.py
          else
            python ingestion/espn_ingest.py --refresh-current
          fi

      - name: Validate season records against Sports-Reference
        # Exits 1 on any mismatch or unparseable page, which fails the job here,
        # so nothing is loaded into Supabase or committed. The in-progress season is skipped.
        # Sports-Reference pages are cached in ingestion/.cache (restored above), so most
        # runs make 0 requests; a cold cache makes ~25 requests at 3.5s each (~90s).
        run: python ingestion/validate_records.py

      - name: Load into Supabase
        if: ${{ env.SUPABASE_URL != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ingestion/supabase_load.py

      - name: Commit refreshed JSON snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/generated
          git diff --cached --quiet || git commit -m "data: refresh ESPN snapshot $(date -u +%F)"
          git push
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
